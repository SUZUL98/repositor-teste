<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudante do 4º Ano</title>
    <link rel="stylesheet" href="Estilo.css">
</head>
<body>
    <main class="cartao">
        <h1>Emilio Madureira</h1>
        <p>
            Estudar Git e GitHub é fundamental
            para o desenvolvimento de software moderno.
        </p>
        <label class="rotulo" for="foto">Carregar fotografia</label>
        <input type="file" id="foto" accept="image/*">
        <img id="visualizar" width="300" alt="Pré-visualização da fotografia">
        <label class="rotulo" for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Digite o seu nome completo">
        <button onclick="mostrar()">Mostrar nome</button>
        <h2 id="resultado"></h2>
    </main>
    <script>
        const foto = document.getElementById("foto");
        foto.onchange = function() {
            const ficheiro = foto.files[0];
            if (ficheiro) {
                document.getElementById("visualizar").src =
                    URL.createObjectURL(ficheiro);
            }
        };
        function mostrar() {
            const nome = document.getElementById("nome").value;
            document.getElementById("resultado").innerHTML =
                "Bem-vindo(a), " + nome + "!";
        }
    </script>

</body>
</html>
